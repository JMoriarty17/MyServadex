<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FGO Catalogue</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="icon" id="fav" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=2">
<style>
:root{--bg:#0f1115;--pn:#171a21;--ln:#262b36;--tx:#e6e8ee;--mu:#7d8494;--ac:#d9b25f;--ok:#5fc79a;--bad:#e07a7a}
:root[data-theme=light]{--bg:#f5f4f0;--pn:#fff;--ln:#e0ddd3;--tx:#1f2229;--mu:#6f7482;--ac:#9a6b12;--ok:#1f8a5c;--bad:#b84a4a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.bar+.bar{margin-top:8px}
h1{font-size:15px;font-weight:600;letter-spacing:.04em;margin:0 10px 0 0;color:var(--ac)}
nav a{color:var(--mu);text-decoration:none;padding:5px 11px;border-radius:6px}
nav a.on{color:var(--tx);background:var(--pn)}
input,select,button,textarea{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 9px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
.chip{border-radius:99px;padding:3px 11px;font-size:12px;color:var(--mu)}
.chip.on{color:var(--ok);border-color:var(--ok)}.chip.no{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.sp{margin-left:auto}.mu{color:var(--mu)}.sm{font-size:12px}
.a{border-color:var(--ac)!important;color:var(--ac)}
#stats{padding:10px 16px;color:var(--mu);font-size:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:0 16px 24px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px;cursor:pointer;position:relative}
.card:hover{border-color:var(--ac)}.card.off{opacity:.4}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.card .n{font-size:12px;margin-top:6px;height:2.4em;line-height:1.2;overflow:hidden}
.card .m{font-size:11px;color:var(--mu)}
.gold{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--ac)}
.pin{position:absolute;top:8px;left:9px;font-size:12px}
.qk{display:flex;gap:3px;margin-top:6px}.qk button{flex:1;padding:2px 0;font-size:11px;border-radius:4px}
#grid.rows{display:block;overflow-x:auto}
.r{display:grid;grid-template-columns:44px minmax(150px,2fr) 70px 60px 50px 90px 90px 110px 50px;gap:10px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--ln);min-width:860px;cursor:pointer}
.r:hover{background:var(--pn)}.r.off{opacity:.4}
.r.h{color:var(--mu);font-size:11px;text-transform:uppercase;cursor:default}.r.h:hover{background:none}
.r img{width:38px;height:38px;border-radius:6px}
#home{padding:16px;max-width:1100px;margin:auto}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}
.pn h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:600}
.big{font-size:30px;font-weight:600;color:var(--ac)}
.bl{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bl span:first-child{width:92px;color:var(--mu)}.bl span:last-child{width:52px;text-align:right}
.bl div{flex:1;height:6px;background:var(--ln);border-radius:3px}.bl i{display:block;height:100%;background:var(--ac);border-radius:3px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ban{background:var(--pn);border:1px solid var(--ac);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
#modal.on{display:flex}
#box{background:var(--bg);border:1px solid var(--ln);border-radius:12px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.top{display:flex;gap:14px;align-items:center}.top img{width:76px;height:76px;border-radius:8px}.top h2{margin:0;font-size:18px}
.sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--ln)}
.sec>b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.fs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.f span{display:block;font-size:11px;color:var(--mu)}.f input{width:100%}
.sk{display:flex;gap:10px;margin-top:10px}.sk img{width:40px;height:40px;flex:none}
.sk b{display:block;font-size:13px}.sk small{color:var(--mu)}
textarea{width:100%;min-height:56px;margin-top:8px}
.dots{display:flex;gap:3px;margin-top:3px}.dot{width:14px;height:5px;border-radius:3px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.th{position:relative;text-align:center}.th img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--pn);border-radius:8px;display:block}
.th.lk img{filter:grayscale(1) brightness(.35)}.lock{position:absolute;top:38%;left:0;right:0;font-style:normal;font-size:22px}
.th small{display:block;color:var(--mu);font-size:11px;margin-top:3px}#fx{margin-top:8px}
details{margin:6px 0}summary{cursor:pointer;padding:3px 0}.nm{display:inline-block;margin:3px 6px 3px 0;padding:2px 9px;border:1px solid var(--ln);border-radius:99px;font-size:12px;cursor:pointer}.nm:hover{border-color:var(--ac)}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:linear-gradient(135deg,var(--pn),var(--bg))}
.rg{position:relative;width:132px;height:132px}.rgt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rgt b{font-size:26px;color:var(--ac)}.rgt span{font-size:11px;color:var(--mu)}
.hx{flex:1;min-width:260px}.hx h2{margin:2px 0 14px;font-size:22px;font-weight:600}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.tile{display:flex;align-items:center;gap:14px;cursor:pointer}.tile:hover,.tl:hover{border-color:var(--ac)}.tile b{display:block;font-size:22px}.tile span{font-size:12px;color:var(--mu)}
.ct{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tl{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px}.tl b{display:block;font-size:16px;margin-top:2px}.tl small{color:var(--mu);font-weight:400}
.bl2,.pb{height:4px;background:var(--ln);border-radius:2px;margin-top:6px}.bl2 i,.pb i{display:block;height:100%;background:var(--ac);border-radius:2px}
.card.l100,.card.l120{border-width:2px;padding:7px}.card.l100{border-color:#a9b2c0}.card.l100:hover{border-color:#d5dbe5}
.card.l120{border-color:#f0c040;box-shadow:0 0 10px #f0c04044}.card.l120:hover{border-color:#ffd966}
.r.l100{box-shadow:inset 3px 0 #a9b2c0}.r.l120{box-shadow:inset 3px 0 #f0c040}
.gg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));column-gap:28px}.stats>div[data-goal]{cursor:pointer}details p{margin:4px 0 8px;font-size:13px}
.addbar{position:sticky;top:-18px;z-index:3;background:var(--bg);padding:10px 0;margin-top:12px;border-bottom:1px solid var(--ln);align-items:center}
.qr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}.ql{width:54px;font-size:11px;color:var(--mu);text-transform:uppercase}.qr button{padding:4px 10px;font-size:12px}
.card.art img{aspect-ratio:3/4;object-position:top}.card.pk{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.pkb{position:absolute;top:30px;left:10px;z-index:2;background:var(--ac);color:#111;border-radius:99px;font:600 11px system-ui;font-style:normal;padding:1px 8px}
.xd{margin-top:6px}.lvl{font-size:12px}.lvl small{color:var(--mu)}
.lb{height:3px;background:var(--ln);border-radius:2px;margin:3px 0 6px}.lb i{display:block;height:100%;background:var(--ac);border-radius:2px}.lb.l100 i{background:#a9b2c0}.lb.l120 i{background:#f0c040}
.sk3{font-size:13px;font-weight:600}.sk3 em{color:var(--mu);font-style:normal;margin:0 3px}.sk3 .g,.mm .g{color:var(--ac)}
.mm{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:3px}
#grid.compact{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.compact .card{padding:5px}.compact .xd,.compact .card .m,.compact .dots{display:none}.compact .card .n{font-size:11px}
.gh{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:12px 2px 2px;border-bottom:1px solid var(--ln)}.gh span{color:var(--ac)}.rows .gh{padding-left:10px}
header{padding:8px 14px}.bar+.bar{margin-top:6px}#act .nm{border-color:var(--ac)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ac);padding:8px 16px;border-radius:8px;z-index:20;display:none}
#sy[data-s=ok]{color:var(--ok)}#sy[data-s=busy],#sy[data-s=pend]{color:var(--ac)}#sy[data-s=err]{color:var(--bad)}#sy[data-s=off]{color:var(--mu)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>FGO CATALOGUE</h1>
    <nav><a href="#home" data-p="home">Home</a><a href="#collection" data-p="collection">My Collection</a><a href="#database" data-p="database">Database</a></nav>
    <span class="sp"></span>
    <span id="vw"><button id="qe" title="Show quick-edit buttons on cards">✎ Edit</button><button id="dn" title="Compact cards">▫ Compact</button><button id="gp" title="Group by class">≡ Group</button><button id="vg" title="Grid (G)">▦</button><button id="vr" title="Rows (G)">☰</button></span>
    <button id="sy" data-s="off" title="Cloud sync">☁</button>
    <button id="th" title="Theme">◐</button>
    <select id="reg"><option>NA</option><option>JP</option></select>
  </div>
  <div id="fb">
    <div class="bar">
      <input id="q" type="search" placeholder="Search name…  ( / )">
      <select id="cls"></select>
      <select id="rar"><option value="">Rarity</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option><option>0</option></select>
      <select id="own"><option value="">All</option><option value="y">Owned</option><option value="n">Not owned</option></select>
      <select id="sort"><option value="no">Sort: No.</option><option value="name">Name</option><option value="lvl">Level</option><option value="bond">Bond</option><option value="rar">Rarity</option><option value="t">Recently edited</option></select><button id="mf">Filters ▾</button>
    </div>
    <div id="more" hidden>
    <div class="bar" id="chips">
      <button class="chip" data-f="max">Fully maxed</button><button class="chip" data-f="lv">Level cap</button><button class="chip" data-f="l100">Lv 100+</button><button class="chip" data-f="l120">Lv 120</button>
      <button class="chip" data-f="sk">Skills 10</button>
      <button class="chip" data-f="fou1">Fou 1000</button><button class="chip" data-f="fou">Fou 2000</button>
      <button class="chip" data-f="np">NP 5</button><button class="chip" data-f="bond10">Bond 10</button><button class="chip" data-f="bond">Bond 15</button>
      <span class="mu sm">Lv ≥</span><input id="lvm" type="number" min="0" max="120" style="width:62px">
      <span class="sp"></span>
      <select id="pre"></select><button id="ps">Save preset</button><button id="pd">Delete</button>
    </div>
    <div class="bar" id="fx"></div>
    </div>
    <div class="bar" id="pk" hidden><span class="mu sm">Pick list:</span><button id="pm">Pick mode: off</button><button id="po">List (0)</button><button id="ps2">▶ Start</button></div>
    <div id="pp" class="pn" hidden style="margin-top:8px"><textarea id="pt" placeholder="Type names, one per line or separated by commas (Gareth, Melusine…)"></textarea><div class="bar" style="margin-top:6px"><button id="pa">Add names</button><button id="psn">Sort by No.</button><button id="pc">Clear</button></div><div id="pl" style="margin-top:8px"></div></div>
  </div>
</header>
<div id="home" hidden></div>
<div id="lib" hidden><div id="stats"></div><div id="act" style="padding:0 16px 8px"></div><div id="grid"></div></div>
<div id="modal"><div id="box"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const API='https://api.atlasacademy.io',DAY=864e5;
let region=LS.get('fgo_region','NA'),view=LS.get('fgo_view','grid'),theme=LS.get('fgo_theme','dark');
let mine=LS.get('fgo_owned',{}),meta=Object.assign({pins:[],presets:[],lastExport:0,del:{},mt:0},LS.get('fgo_meta',{}));
let list=[],cache={},fs={},navL=[],fh=null,wt;
const blank=()=>({lvl:1,asc:0,np:1,sk:[1,1,1],ap:[0,0,0,0,0],hp:0,atk:0,bond:0,grail:0,note:'',t:Date.now()});
const norm=m=>Object.assign(blank(),m,{sk:(m.sk||[1,1,1]).slice(0,3),ap:m.ap||[0,0,0,0,0]});
Object.keys(mine).forEach(k=>mine[k]=norm(mine[k]));
const PG=()=>location.hash.slice(1)||'home';
const clean=t=>(t||'').replace(/\[[^\]]*\]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const stars=s=>'★'.repeat(s.rar)||'—';
const BASE={5:90,4:80,3:70,2:65,1:60,0:40};
const maxLv=s=>BASE[s.rar]||40;
const CN={moonCancer:'Moon Cancer',alterEgo:'Alter Ego',cccAlterEgo:'Alter Ego (CCC)',unBeastOlgaMarie:'Beast (Olga Marie)',beastEresh:'Beast (Ereshkigal)'};
const cn=c=>CN[c]||c.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,x=>x.toUpperCase());
const P={asc:m=>m.asc>=4,sk:m=>m.sk.every(x=>x>=10),fou:m=>m.hp>=2000&&m.atk>=2000,ap:m=>m.ap.every(x=>x>=10),np:m=>m.np>=5,bond:m=>m.bond>=15,
  max:m=>P.sk(m)&&P.fou(m),lv:(m,s)=>m.lvl>=maxLv(s,m)};
const sv=no=>list.find(s=>s.no==no);
P.fou1=m=>m.hp>=1000&&m.atk>=1000;P.l100=m=>m.lvl>=100;P.l120=m=>m.lvl>=120;P.bond10=m=>m.bond>=10;
const GOALS=[['Fully maxed','max'],['Skills 10/10/10','sk'],['Fou 1000','fou1'],['Fou 2000','fou'],['Bond 10','bond10'],['Bond 15','bond'],['NP 5','np'],['Level cap','lv'],['Level 100+','l100'],['Level 120','l120']];
const FM={max:m=>`${m.sk.join('/')} · +${m.hp}/${m.atk}`,sk:m=>m.sk.join('/'),fou:m=>`+${m.hp}/${m.atk}`,ap:m=>m.ap.join('/'),np:m=>'NP'+m.np,bond:m=>'♥'+m.bond,lv:(m,s)=>`Lv${m.lvl}/${maxLv(s)}`,fou1:m=>`+${m.hp}/${m.atk}`,bond10:m=>'♥'+m.bond,l100:m=>'Lv'+m.lvl,l120:m=>'Lv'+m.lvl};
const todoOf=(own,k)=>own.filter(s=>!P[k](mine[s.no],s));
const leftHtml=own=>GOALS.map(([l,k])=>{const t=todoOf(own,k);return `<details><summary>${l}: <b>${t.length}</b> left</summary><div>${t.map(s=>{const f=FM[k](mine[s.no],s);return `<span class="nm" data-no="${s.no}">${s.name}${f?` <span class="mu">${f}</span>`:''}</span>`}).join('')||'<span class="mu sm">All done 🎉</span>'}</div></details>`}).join('');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}

// ---------- saving ----------
const bundle=()=>JSON.stringify({mine,meta},null,2);
async function writeFile(){if(!fh)return;try{const w=await fh.createWritable();await w.write(bundle());await w.close()}catch{fh=null;toast('Linked file lost, relink it')}}
function save(){const pp=JSON.stringify([meta.pins,meta.presets]);if(pp!==lastPP){lastPP=pp;meta.mt=Date.now()}LS.set('fgo_owned',mine);LS.set('fgo_meta',meta);clearTimeout(wt);wt=setTimeout(writeFile,600);syQueue(2500)}
function exportJ(){meta.lastExport=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bundle()],{type:'application/json'}));a.download='fgo-collection.json';a.click();render()}
function importJ(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text()),nm=o.mine||o,now=Date.now(),old=mine,keep=meta.del||{};
  const nt=e=>{const c=Object.assign({},e);delete c.t;return stable(c)};
  Object.keys(old).forEach(k=>{if(!nm[k])keep[k]=now});
  const next={};Object.keys(nm).forEach(k=>{const e=norm(nm[k]);if(old[k]&&nt(old[k])==nt(e))e.t=old[k].t;else e.t=now;next[k]=e});
  Object.keys(mine).forEach(k=>delete mine[k]);Object.assign(mine,next);
  if(o.meta)Object.assign(meta,o.meta);meta.del=Object.assign({},(o.meta&&o.meta.del)||{},keep);meta.pins=(meta.pins||[]).filter(x=>mine[x]);
  save();render();toast('Imported')}catch{alert('Invalid file')}};i.click()}
async function linkFile(){if(!window.showSaveFilePicker)return alert(navigator.brave?'Brave turns file saving off by default.\n\n1. Open brave://flags/#file-system-access-api\n2. Set it to Enabled\n3. Relaunch Brave and try again.\n\nUntil then, use Export to back up.':'Your browser does not support auto-save to a file (Chrome, Edge or Brave with the file-system flag on). Use Export to back up.');try{fh=await showSaveFilePicker({suggestedName:'fgo-collection.json',types:[{accept:{'application/json':['.json']}}]});await writeFile();toast('Auto-saving to file this session');render()}catch{}}

// ---------- cloud sync (private GitHub repo) ----------
const SYK='fgo_sync';
let SY=LS.get(SYK,null),sySt={k:'off',msg:'Not connected'},syTm=null,syBusy=false,syAgain=false,syT0=0,lastPP=JSON.stringify([meta.pins,meta.presets]);
meta.del=meta.del||{};meta.mt=meta.mt||0;
const syOn=()=>!!(SY&&SY.token&&SY.owner&&SY.repo);
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const syMeta=()=>({pins:meta.pins,presets:meta.presets,del:meta.del,mt:meta.mt});
const syBundle=()=>JSON.stringify({mine,meta:syMeta()},null,2);
const syUrl=()=>`https://api.github.com/repos/${SY.owner}/${SY.repo}/contents/${(SY.path||'fgo-collection.json').split('/').map(encodeURIComponent).join('/')}`;
const syH=()=>({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
function setSy(k,msg){sySt={k,msg};syUI()}
function syUI(){
  const b=$('#sy');if(b){b.dataset.s=sySt.k;b.title='Cloud sync: '+sySt.msg}
  const s=$('#sys');if(s)s.textContent=sySt.msg;
}
const syTime=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function syErr(r){
  if(r.status==401)return 'Token is invalid or expired. Create a new one and reconnect.';
  if(r.status==403)return 'Token has no write access. It needs "Contents: Read and write" on the data repo.';
  if(r.status==404)return 'Repository not found, or the token has no access to it.';
  return 'GitHub error '+r.status;
}
// Merge remote data into local, per servant: newest edit wins, deletions are remembered.
function mergeRemote(rm,rmeta){
  const before=stable({mine,meta:syMeta()}),now=Date.now();
  const del=Object.assign({},rmeta.del||{}),ld=meta.del||{};
  for(const k in ld)del[k]=Math.max(del[k]||0,ld[k]);
  const out={};
  new Set([...Object.keys(mine),...Object.keys(rm)]).forEach(k=>{
    const a=mine[k],b=rm[k];
    const win=!a?b:!b?a:((a.t||0)>=(b.t||0)?a:b);
    if(del[k]&&del[k]>=(win.t||0))return;
    if(a&&win===b)Object.assign(a,norm(b));
    out[k]=a||norm(b);
  });
  Object.keys(mine).forEach(k=>{if(!(k in out))delete mine[k]});

async function syncNow(){
  if(!syOn())return;
  if(syBusy){syAgain=true;return}
  clearTimeout(syTm);syBusy=true;setSy('busy','Syncing…');let changed=false;
  try{
    for(let n=0;n<4;n++){
      const r=await fetch(syUrl()+(SY.branch?'?ref='+encodeURIComponent(SY.branch):''),{headers:syH(),cache:'no-store'});
      let sha=null,remote=null;
      if(r.ok){
        const j=await r.json();sha=j.sha;
        if(!j.content&&j.size)throw new Error('Data file is too large for sync.');
        remote=JSON.parse(j.content?b64d(j.content):'{}');
      }else if(r.status!=404)throw new Error(syErr(r));
      if(remote){
        const rm=remote.mine||(remote.meta?{}:remote);
        if(mergeRemote(rm,remote.meta||{}))changed=true;
        if(stable({mine:remote.mine||{},meta:remote.meta||{}})===stable({mine,meta:syMeta()}))break;
      }
      const body={message:'sync '+new Date().toISOString(),content:b64e(syBundle())};
      if(sha)body.sha=sha;if(SY.branch)body.branch=SY.branch;
      const w=await fetch(syUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},syH()),body:JSON.stringify(body)});
      if(w.ok)break;
      if((w.status==409||w.status==422)&&n<3)continue;
      throw new Error(syErr(w));
    }
    syT0=Date.now();setSy('ok','Synced at '+syTime());
  }catch(e){
    if(e instanceof TypeError)setSy('pend','Offline. Changes will sync when you are back online.');
    else setSy('err',String(e.message||e));
  }finally{
    syBusy=false;
    if(changed)render();
    if(syAgain){syAgain=false;syQueue(500)}
  }
}
function syQueue(ms){
  if(!syOn())return;
  if(!syBusy)setSy('pend',navigator.onLine?'Unsynced changes…':'Offline. Changes will sync when you are back online.');
  clearTimeout(syTm);syTm=setTimeout(syncNow,ms);
}

const storageInfo=()=>{if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const el=$('#offu');if(el)el.textContent=`Browser storage in use: ${(e.usage/1048576).toFixed(0)} MB of about ${(e.quota/1048576).toFixed(0)} MB`})};
async function fetchAll(urls,label){
  const c=await caches.open('fgo-off');let i=0,done=0,ok=0,fail=0;
  const w=async()=>{while(i<urls.length){const u=urls[i++];try{if(!(await c.match(u))){const r=await fetch(u,{mode:'cors'});if(!r.ok)throw 0;await c.put(u,r)}ok++}catch{fail++}
    done++;if(done%10==0||done==urls.length)setOff(`${label}: ${done}/${urls.length}${fail?` (${fail} failed)`:''}`);
    if(fail>=10&&!ok){i=urls.length;throw new Error('the image server did not allow saving images offline')}}};
  await Promise.all([1,2,3,4].map(w));
}
async function offline(level){
  if(!('caches' in window)||!navigator.serviceWorker||!location.protocol.startsWith('http'))return setOff('Offline mode needs the hosted or localhost version, not a double-clicked file.');
  if(offBusy||!list.length)return;offBusy=true;
  try{
    await fetchAll([...new Set(list.map(s=>s.face))],'Face icons');
    if(level>=2){
      const own=list.filter(s=>mine[s.no]),api=await caches.open('fgo-api-v1'),urls=[];let i=0;
      for(const s of own){setOff(`Servant details: ${++i}/${own.length}`);const u=`${API}/nice/${region}/servant/${s.no}?lore=true&lang=en`;
        try{let r=await api.match(u);if(!r){r=await fetch(u);if(!r.ok)throw 0;await api.put(u,r.clone())}const d=await r.json(),e=d.extraAssets||{};
          urls.push(...Object.values(e.charaGraph?.ascension||{}),...Object.values(e.faces?.ascension||{}),...(d.skills||[]).map(k=>k.icon),...(d.classPassive||[]).map(k=>k.icon),...(d.appendPassive||[]).map(a=>a.skill?.icon))}catch{}}
      await fetchAll([...new Set(urls.filter(Boolean))],'Servant art');
    }
    setOff('Done. Offline data saved.');
  }catch(e){setOff('Stopped: '+(e.message||e))}
  offBusy=false;storageInfo();
}
$('#home').addEventListener('click',e=>{const i=e.target.id;
  if(i=='o1')offline(1);if(i=='o2')offline(2);
  if(i=='op'&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(ok=>toast(ok?'The browser will keep your offline data':'The browser declined; data may be cleared when space is low'));
  if(i=='oc'&&'caches' in window)Promise.all([caches.delete('fgo-off'),caches.delete('fgo-api-v1')]).then(()=>{toast('Offline data cleared');setOff('');storageInfo()})});
window.onhashchange=route;
document.documentElement.dataset.theme=theme;load();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
